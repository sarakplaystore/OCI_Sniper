# fly.toml app configuration file generated for oci-sniper on 2026-11-02T02:46:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oci-sniper'
primary_region = 'ams'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  KEEPALIVE_ENABLED = 'false'
  LOG_LEVEL = 'info'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
