name: CI and Fly.io deploy

# Deploys on every push to main (and on manual dispatch) once the repository has
# a FLY_API_TOKEN secret. Without the secret the deploy steps skip themselves, so
# forks and fresh clones do not fail CI.
#
#   fly tokens create deploy -x 999999h
#   gh secret set FLY_API_TOKEN

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        # No --no-cache-dir here: setup-python's `cache: pip` saves and restores
        # ~/.cache/pip, and a no-cache install leaves that directory missing, which
        # fails the post-job cache step even though the tests themselves passed.
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          APP_PASSWORD: test-password
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  deploy:
    name: Deploy to Fly.io
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip notice
        if: env.FLY_API_TOKEN == ''
        run: |
          echo "::notice::FLY_API_TOKEN is not set, skipping deploy (forks and pull requests)."
          echo "Add a deploy token with: gh secret set FLY_API_TOKEN"

      # A green run that deployed nothing is worse than a red one: this is how a
      # missing token went unnoticed while https://<app>.fly.dev answered nothing.
      # Only the canonical repository fails here, so forks keep passing.
      - name: Fail when main cannot be deployed
        if: >-
          env.FLY_API_TOKEN == '' && github.ref == 'refs/heads/main' &&
          github.repository == 'sarakplaystore/OCI_Sniper'
        run: |
          echo "::error::FLY_API_TOKEN is missing, so this run deployed nothing."
          echo "Create a deploy token and store it as a repository secret:"
          echo "  fly tokens create deploy -x 999999h"
          echo "  gh secret set FLY_API_TOKEN"
          exit 1

      - uses: actions/checkout@v5
        if: env.FLY_API_TOKEN != ''

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        # --remote-only builds on Fly's builders (no Docker daemon on the runner),
        # --ha=false creates a single Machine (the loop slot is per process), and
        # --wait-timeout makes the job fail if the Machine never passes /healthz.
        run: flyctl deploy --remote-only --ha=false --wait-timeout=5m

      - name: Smoke test the public endpoint
        if: env.FLY_API_TOKEN != ''
        # The deploy's own health check runs inside Fly's network. This proves the
        # app is also reachable the way a browser reaches it.
        run: |
          app="$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml', 'rb'))['app'])")"
          if [ -z "$app" ]; then echo "::error::could not read 'app' from fly.toml"; exit 1; fi
          url="https://${app}.fly.dev/healthz"
          echo "Waiting for $url"
          curl -fsS --retry 8 --retry-all-errors --retry-delay 10 --max-time 20 "$url"
